name: Register

# Manual registration into the General registry (NF20).
#
# `julia-actions/RegisterAction` takes only `token` and
# `registrator` — it has no version input — so the bump is performed
# here, against Project.toml, before registration is triggered.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which SemVer component to increment
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"

      - name: Bump the version in Project.toml
        id: bump
        # The project is pre-1.0, and `patch` is the default, so a
        # release never leaves 0.x by accident. Choosing `major` from
        # 0.x yields 1.0.0 — a deliberate stability commitment, not
        # something to pick casually.
        run: |
          julia --startup-file=no -e '
            using Pkg
            project = Pkg.Types.read_project("Project.toml")
            old = project.version
            bump = ENV["BUMP"]
            new = if bump == "patch"
                VersionNumber(old.major, old.minor, old.patch + 1)
            elseif bump == "minor"
                VersionNumber(old.major, old.minor + 1, 0)
            else
                VersionNumber(old.major + 1, 0, 0)
            end
            project.version = new
            Pkg.Types.write_project(project, "Project.toml")
            println("old=", old, " new=", new)
            open(ENV["GITHUB_OUTPUT"], "a") do io
                println(io, "version=", new)
            end
          '
        env:
          BUMP: ${{ inputs.bump }}

      - name: Commit the bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Project.toml
          git commit -m "chore: release v${{ steps.bump.outputs.version }}"
          git push

      - name: Ask Registrator to register the release
        uses: julia-actions/RegisterAction@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
