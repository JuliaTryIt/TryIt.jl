# Keeps the GitHub Actions used by CI, Documenter, TagBot, and
# Register up to date (NF21). Julia dependencies are not covered:
# Dependabot has no Julia ecosystem, and Project.toml [compat] bounds
# are widened by hand.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
